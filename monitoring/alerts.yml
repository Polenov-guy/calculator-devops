groups:
  - name: calculator
    rules:
      - alert: CalculatorUnavailable
        expr: probe_success{job="blackbox"} == 0 or up{job="blackbox"} == 0
        for: 30s
        labels: {severity: critical}
        annotations: {summary: 'Calculator readiness probe failed'}
      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Less than 10 percent host memory available'}
